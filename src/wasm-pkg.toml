# Registry routing for package adapters, compiled into the emery binary.
#
# This is a wasm-pkg client configuration (the schema of `wkg`'s own
# `~/.config/wasm-pkg/config.toml`), embedded by `src/main.rs` beside the
# deployment's default registry. A package reference resolves to its
# `package_registry_overrides` entry, else its namespace's registry, else the
# default (`omnia.host`). The registries a run may reach are fixed here, in
# the binary: a project's `emery.toml` names adapters, never registries.
#
# A registry name resolves through its `/.well-known/wasm-pkg/registry.json`
# metadata to the backing store, so no per-registry backend settings are
# needed for registries that publish it.

[namespace_registries]
# First-party adapters (`emery:<name>@<semver>`): the `emery` namespace is
# augentic's, published through `augentic.io`.
emery = "augentic.io"

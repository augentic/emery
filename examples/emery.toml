# Emery configuration.
#
# Each [[source]] entry names one source.
#  - `adapter`: a package, a `.wasm` path beneath the adapters root
#    (`~/.emery/adapters`), or a bare name the deployment declares.
#  - `name`: the name the specification cites the source by; omitted, it is
#    the adapter's name, as on the command line.
#  - `path`: a workspace path relative to this file.
#  - `description`: an inline description.
#  - `digest`: pins the adapter's bytes to a `sha256:` hash.
#
# The [target] table names the one adapter `emery build` builds every slice
# of the plan through: `adapter` and `digest`, as above.
#
# A package adapter fetches from the registry `~/.emery/wasm-pkg.toml` routes
# its namespace to; `emery` is augentic.io unless re-routed there, and other
# namespaces must be routed there. This file routes nothing.

# Live journey: the mock source component over its fixture tree.
[[source]]
name = "docs"
adapter = "source.wasm"
path = "docs/"

# Live journey: the mock target component, building into the invocation
# directory.
[target]
adapter = "target.wasm"


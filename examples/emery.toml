# Emery configuration.
#
# Each [[source]] entry names one source.
#  - `adapter`: an exact package reference, `namespace:name@version`, read
#    from the store (`~/.emery/adapters`, as `namespace_name@version.wasm`)
#    and fetched into it when the store lacks it.
#  - `name`: the name the specification cites the source by; omitted, it is
#    the package's name, as on the command line.
#  - `path`: a workspace path relative to this file.
#  - `description`: an inline description.
#  - `digest`: pins the adapter's bytes to a `sha256:` hash.
#
# The [target] table names the one adapter `emery build` builds every slice
# of the plan through: `adapter` and `digest`, as above.
#
# The `emery` namespace is fetched from augentic.io; any other namespace is
# put in the store by hand, `wkg get <reference> -o ~/.emery/adapters/` or a
# `cp` of a built component. This file routes nothing.

# Live journey: the mock source component over its fixture tree, copied into
# the store as `example_source@0.1.0.wasm` (examples/README.md).
[[source]]
name = "docs"
adapter = "example:source@0.1.0"
path = "docs/"

# Live journey: the mock target component, `example_target@0.1.0.wasm` in the
# store, building into the invocation directory.
[target]
adapter = "example:target@0.1.0"


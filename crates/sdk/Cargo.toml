[package]
name = "emery-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Emery adapter SDK: the types and functions a source-adapter guest is written with — mine over an adapter's seams, one gated model call each over omnia's model capability, joined; the survey helpers; the reference-tool closure; and the world's export bindings over the emery-adapter contract"
categories = ["development-tools"]
keywords = ["emery", "adapter", "sdk"]
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
emery-adapter.workspace = true
emery-prose.workspace = true
futures.workspace = true
omnia-sdk.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia-test = { workspace = true, features = ["guest"] }
tempfile.workspace = true

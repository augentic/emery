[package]
name = "test-programs"
description = "Guest drivers for the SDK suites and their compiled wasm32 artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
autoexamples = false

[lints]
workspace = true

[dependencies]
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json.workspace = true
emery-adapter.workspace = true
omnia-sdk.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json.workspace = true
emery-adapter.workspace = true
emery-sdk.workspace = true
emery-prose.workspace = true
futures.workspace = true
omnia-sdk = { workspace = true, features = ["command"] }
wasip3.workspace = true

[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }

# Generated by build.rs from programs/<group>/<scenario>.rs.

[[example]]
name = "adapter_script_source"
path = "programs/adapter/script_source.rs"
crate-type = ["cdylib"]

[[example]]
name = "adapter_script_target"
path = "programs/adapter/script_target.rs"
crate-type = ["cdylib"]

[[example]]
name = "sdk_build"
path = "programs/sdk/build.rs"
crate-type = ["cdylib"]

[[example]]
name = "sdk_extract"
path = "programs/sdk/extract.rs"
crate-type = ["cdylib"]

[[example]]
name = "sdk_survey"
path = "programs/sdk/survey.rs"
crate-type = ["cdylib"]

[[example]]
name = "sdk_verify"
path = "programs/sdk/verify.rs"
crate-type = ["cdylib"]

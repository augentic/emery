# https://embarkstudios.github.io/cargo-deny

[graph]
all-features = true
# Only what is built: the shipped hosts (publish.yaml's matrix, also the CI
# and dev hosts) and the WASI component target of the engine guest and the
# mock adapter.
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "wasm32-wasip2",
]

[output]
feature-depth = 1

[advisories]
unmaintained = 'workspace'

[licenses]
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[sources]
allow-git = [
  "https://github.com/augentic/omnia",
  "https://github.com/augentic/omnia-backends",
  "https://github.com/bytecodealliance/wrpc"
]

[bans]
deny = []
multiple-versions = "allow"
skip = []
skip-tree = []
wildcards = "allow"

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "warn"

[package]
name = "emery"
description = "A tool for specifying and running code generation workflows"
categories = ["command-line-utilities", "development-tools"]
keywords = ["emery", "cli", "spec", "workflow", "automation"]
readme = "README.md"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

# `rlib` alone: the wasm32 guest is built as a `cdylib` by `build.rs` on the
# command line, so no native dylib is linked beside the binary.
[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "emery"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
omnia.workspace = true
omnia-cursor.workspace = true
omnia-filesystem.workspace = true
omnia-git.workspace = true
omnia-wasi-blobstore.workspace = true
omnia-wasi-keyvalue.workspace = true
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true
omnia-wasi-vcs.workspace = true
toml.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
emery-adapter.workspace = true
emery-cli.workspace = true
omnia-sdk.workspace = true
wasip3.workspace = true

[build-dependencies]
omnia.workspace = true

[dev-dependencies]
emery-sdk.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
anyhow.workspace = true
emery-adapter.workspace = true
emery-cli.workspace = true
emery-engine.workspace = true
hex.workspace = true
omnia-sdk.workspace = true
omnia-test = { workspace = true, features = ["guest", "host"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[[example]]
name = "source"
path = "examples/source/lib.rs"
crate-type = ["cdylib"]

[[example]]
name = "target"
path = "examples/target/lib.rs"
crate-type = ["cdylib"]

[lints]
workspace = true

[workspace]
members = ["crates/*"]

[workspace.package]
authors = ["Augentic"]
edition = "2024"
homepage = "https://augentic.io"
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/emery"
rust-version = "1.99"
version = "0.38.0"

[workspace.lints.rust]
meta_variable_misuse = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# cherry-picked `restriction`s
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
dbg_macro = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
fn_to_numeric_cast_any = "warn"
map_err_ignore = "warn"
print_stderr = "warn"
print_stdout = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
schemars = "1.2.2"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "rt"] }
toml = "1.1.6"
tracing = "0.1.44"
wasip3 = "0.9.0"
wit-bindgen = { version = "0.62.0", features = ["async-spawn"] }

emery-adapter = { path = "crates/adapter" }
emery-cli = { path = "crates/cli" }
emery-engine = { path = "crates/engine" }
emery-prose = { path = "crates/prose" }
emery-sdk = { path = "crates/sdk" }

omnia = { version = "0.37.0", default-features = false, features = ["jit", "link", "loader"] }
omnia-sdk = { version = "0.37.0", default-features = false, features = ["command"] }
omnia-test = { version = "0.37.0", default-features = false }
omnia-wasi-blobstore = "0.37.0"
omnia-wasi-keyvalue = "0.37.0"
omnia-wasi-model = "0.37.0"
omnia-wasi-otel = "0.37.0"
omnia-wasi-vcs = "0.37.0"

omnia-cursor = "0.31.0"
omnia-filesystem = "0.31.0"
omnia-git = "0.31.0"

# Co-development over the sibling `wasi-vcs` worktrees (`../omnia-vcs`,
# `../omnia-backends-vcs`) until omnia 0.37.0 and omnia-backends 0.31.0
# release with `omnia-wasi-vcs` and `omnia-git`. The committed form is the
# git stanza below, with the `../omnia/…` path patches commented out.
[patch.crates-io]
omnia = { git = "https://github.com/augentic/omnia" }
omnia-core = { git = "https://github.com/augentic/omnia" }
omnia-sdk = { git = "https://github.com/augentic/omnia" }
omnia-guest-macros = { git = "https://github.com/augentic/omnia" }
omnia-host-macros = { git = "https://github.com/augentic/omnia" }
omnia-plugin = { git = "https://github.com/augentic/omnia" }
omnia-test = { git = "https://github.com/augentic/omnia" }
omnia-wasi-blobstore = { git = "https://github.com/augentic/omnia" }
omnia-wasi-keyvalue = { git = "https://github.com/augentic/omnia" }
omnia-wasi-model = { git = "https://github.com/augentic/omnia" }
omnia-wasi-otel = { git = "https://github.com/augentic/omnia" }
omnia-wasi-vcs = { git = "https://github.com/augentic/omnia" }
# omnia = { path = "../omnia-vcs/crates/omnia" }
# omnia-core = { path = "../omnia-vcs/crates/omnia-core" }
# omnia-sdk = { path = "../omnia-vcs/crates/omnia-sdk" }
# omnia-guest-macros = { path = "../omnia-vcs/crates/guest-macros" }
# omnia-host-macros = { path = "../omnia-vcs/crates/host-macros" }
# omnia-plugin = { path = "../omnia-vcs/crates/omnia-plugin" }
# omnia-test = { path = "../omnia-vcs/crates/omnia-test" }
# omnia-wasi-blobstore = { path = "../omnia-vcs/crates/wasi-blobstore" }
# omnia-wasi-keyvalue = { path = "../omnia-vcs/crates/wasi-keyvalue" }
# omnia-wasi-model = { path = "../omnia-vcs/crates/wasi-model" }
# omnia-wasi-otel = { path = "../omnia-vcs/crates/wasi-otel" }
# omnia-wasi-vcs = { path = "../omnia-vcs/crates/wasi-vcs" }

omnia-cursor = { git = "https://github.com/augentic/omnia-backends" }
omnia-filesystem = { git = "https://github.com/augentic/omnia-backends" }
omnia-git = { git = "https://github.com/augentic/omnia-backends" }
# omnia-cursor = { path = "../omnia-backends-vcs/crates/cursor" }
# omnia-filesystem = { path = "../omnia-backends-vcs/crates/filesystem" }
# omnia-git = { path = "../omnia-backends-vcs/crates/git" }

[profile.release]
lto = true
opt-level = 2
strip = true

# Optimise Cranelift debug builds — the unoptimised codegen is ~10x slower.
[profile.dev.package]
"*" = { debug = "line-tables-only" }
cranelift-assembler-x64 = { opt-level = 2 }
cranelift-bforest = { opt-level = 2 }
cranelift-bitset = { opt-level = 2 }
cranelift-codegen = { opt-level = 2 }
cranelift-control = { opt-level = 2 }
cranelift-entity = { opt-level = 2 }
cranelift-frontend = { opt-level = 2 }
cranelift-native = { opt-level = 2 }
regalloc2 = { opt-level = 2 }
wasmparser = { opt-level = 2 }
wasmtime-environ = { opt-level = 2 }
wasmtime-internal-cranelift = { opt-level = 2 }
